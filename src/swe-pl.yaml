design:
  theme: classic
  page:
    show_footer: true
  colors:
    name: rgb(0, 0, 0)
    section_titles: rgb(0, 0, 0)
  typography:
    font_family: DejaVu Sans Mono
    font_size:
      body: 8pt
    alignment: justified-with-no-hyphenation
  header:
    alignment: left
    connections:
      phone_number_format: international
      hyperlink: true
      show_icons: true
      display_urls_instead_of_usernames: true
      space_between_connections: "0.50cm"
  entries:
    summary:
      space_above: "0.15cm"
    highlights:
      space_above: "0.15cm"
  section_titles:
    type: with_partial_line
    space_above: "0.5cm"
    space_below: "0.5cm"
  links:
    underline: false
    show_external_link_icon: true
  templates:
    footer: |-
      Wyrażam zgodę na przetwarzanie moich danych osobowych dla potrzeb niezbędnych do realizacji
      #linebreak()
      procesu rekrutacji, zgodnie z Rozporządzeniem Parlamentu Europejskiego i Rady (UE) 2016/679 (RODO).

