cv:
  name: Jakub Sarnowski
  headline: Senior Frontend Engineer
  location: Gniezno
  email: hello@jsarnowski.com
  phone: +48 785 748 506
  website: https://jsarnowski.com
  social_networks:
    - network: GitHub
      username: jsardev
    - network: LinkedIn
      username: jsardev
    - network: X
      username: jsardev

  sections:
    Podsumowanie:
      - "Senior Frontend Engineer o nastawieniu inżyniera produktu: ponad 10 lat doświadczenia w budowaniu złożonych interfejsów produktowych w React i TypeScript, ze szczególną ekspertyzą w architekturze frontendu, design systemach i wydajności aplikacji webowych. Sprawny daleko poza frontendem — usługi Node.js, Java i Kotlin, wdrożenia na Kubernetes, CI/CD — oraz w całym cyklu życia produktu, od rozwiązywania problemów UX i analizy technicznej po dostarczanie i developer experience."

    Doświadczenie zawodowe:
      - company: Przerwa zawodowa
        position: ""
        start_date: 2025-11
        end_date: present
        summary: Urlop typu sabbatical poświęcony nauce i projektom osobistym.
        highlights:
          - Zbudowałem serwis e-commerce z blogiem, obsługą płatności i integracjami newslettera, aby poznać PayloadCMS.
          - Zbudowałem własną infrastrukturę serwerową na oprogramowaniu open source do automatyzacji, monitoringu i observability.
          - Poznałem AdonisJS, dojrzały full-stackowy framework Node.js, jako fundament przyszłych projektów.
          - "**Technologie:** TypeScript, AdonisJS, PayloadCMS, Stripe, Notifuse, Hetzner, GitHub Actions"

      - company: "[Enixware](https://enixware.com)"
        position: Senior Frontend Developer
        start_date: 2023-11
        end_date: 2025-05
        location: Zdalnie
        summary: Praca nad rozbudowaną platformą gier webowych obsługującą tysiące jednocześnie połączonych użytkowników.
        highlights:
          - Opracowałem interaktywną grę przeglądarkową opartą na Web3 oraz towarzyszący jej landing page.
          - Zaimplementowałem zautomatyzowane rozwiązanie do transformacji bazy kodu, skracając czas dużej migracji stylowania z 4 tygodni do 1 tygodnia.
          - "**Technologie:** TypeScript, React, Astro, React Router, React Query, XState, Phaser, Tailwind, GritQL, GitHub Actions, Jira, Confluence"

      - company: "[ClickUp](https://clickup.com)"
        position: Senior Frontend Engineer
        start_date: 2022-07
        end_date: 2023-03
        location: Zdalnie
        summary: Praca nad dużą aplikacją reaktywną, ze szczególnym naciskiem na rozbudowane wykresy raportowe i wizualizacje danych.
        highlights:
          - Inicjowałem zbieranie danych o metrykach wydajności wizualizacji danych oraz ogólnego doświadczenia użytkownika.
          - "**Technologie:** TypeScript, Angular, NgRx, RxJS, Nx, GitHub Actions, ClickUp"

      - company: "[Netguru](https://netguru.com)"
        position: Senior Frontend Developer
        start_date: 2020-03
        end_date: 2022-06
        location: Zdalnie
        summary: Dostarczanie rozwiązań frontendowych dla produktów klientów z branż e-commerce i ubezpieczeń.
        highlights:
          - Zaprojektowałem i zaimplementowałem autorskie rozwiązanie server-side rendering dla platformy e-commerce, poprawiając wynik Google Lighthouse o 70 punktów.
          - Zbudowałem frontend systemu wyceny ubezpieczeń domowych ze złożoną logiką obliczeniową.
          - Uczestniczyłem w procesie rekrutacji, przeprowadzając rozmowy techniczne i udzielając kandydatom szczegółowej informacji zwrotnej oraz wskazówek rozwojowych.
          - "**Technologie:** TypeScript, Node.js, React, Next.js, Razzle, Redux, MobX, Storyblok, Google Cloud, Jira, Confluence"

      - company: "[Freelancing](https://jsarnowski.com)"
        position: Software Engineer
        start_date: 2018-01
        end_date: 2019-06
        location: Zdalnie
        summary: Świadczenie usług programistycznych dla klientów indywidualnych, od pomysłu do wdrożenia produkcyjnego.
        highlights:
          - Opracowałem identyfikację wizualną i rozwiązania programistyczne dla trenera personalnego, zarządzając pełnym stosem technologicznym i infrastrukturą wdrożeniową.
          - Ściśle współpracowałem z klientem, aby możliwości oprogramowania odpowiadały wizji marki.
          - Zaimplementowałem bezpieczną obsługę płatności i system zarządzania subskrypcjami.
          - Poprawiłem współczynnik konwersji klienta o 20% dzięki landing page'owi napisanemu na zamówienie.
          - "**Technologie:** JavaScript, Next.js, React, Fastify, Ramda, Stripe, GitHub Actions, Trello"

      - company: "[Allegro](https://allegro.pl)"
        position: Software Engineer
        start_date: 2016-01
        end_date: 2017-12
        location: Poznań
        summary: Praca nad domeną sprzedawcy — tworzeniem i wyświetlaniem ofert — w dużej, rozproszonej platformie marketplace.
        highlights:
          - Tworzyłem aplikacje na dużą skalę oraz mikroserwisy w rozproszonej infrastrukturze, zajmując się orkiestracją i aspektami DevOps.
          - Uczestniczyłem w projektowaniu produktu i planowaniu, w tym w omawianiu wymagań i tworzeniu roadmap.
          - Skutecznie współpracowałem w zespole zgodnie z metodyką SCRUM oraz mentorowałem młodszych deweloperów.
          - Utrzymywałem i ulepszałem przestarzałe systemy, optymalizując zużycie zasobów.
          - Samodzielnie pracowałem nad złożoną aplikacją, aktywnie rozwiązując problemy i uczestnicząc w code review, aby zwiększyć swoją wiedzę i samodzielność.
          - Dzieliłem się wiedzą z zespołem, ucząc aspirujących Software Engineerów i przekazując wiedzę z zakresu testowania.
          - "**Technologie:** JavaScript, React, Redux, Node.js, Koa, Express, Java, Kotlin, Spring, PHP, Symfony, Kafka, Hermes, Consul, Mesos, Marathon, Bamboo, Jira, Confluence"

      - company: "[Allegro](https://allegro.pl)"
        position: QA Engineer
        start_date: 2015-01
        end_date: 2015-12
        location: Poznań
        summary: Zapewnienie jakości i niezawodności dużej platformy marketplace poprzez testy automatyczne i manualne.
        highlights:
          - Tworzyłem testy automatyczne dla infrastruktury opartej na mikroserwisach, w tym testy wieloprzeglądarkowe oraz zadania cykliczne dla ciągłej integracji.
          - Proponowałem nowe technologie poprawiające komfort pracy deweloperów i pracowałem nad zwiększeniem dbałości firmy o jakość produktu.
          - Tworzyłem czytelne i powtarzalne raporty błędów ze szczegółowymi krokami reprodukcji oraz przygotowywałem środowiska testowe.
          - "**Technologie:** JavaScript, Java, Selenium, Selenium Grid, JMeter, Bamboo, Jira, Confluence"

      - company: "[mTab](https://mtab.com)"
        position: QA Engineer
        start_date: 2013-10
        end_date: 2014-12
        location: Poznań
        summary: Zapewnienie jakości oprogramowania analitycznego dla branży motoryzacyjnej poprzez kompleksowe testy manualne i automatyczne.
        highlights:
          - Weryfikowałem poprawność danych w złożonych wykresach i wizualizacjach analitycznych dla danych sprzedażowych branży motoryzacyjnej, zapewniając klientom rzetelną analizę biznesową.
          - Opracowałem zestawy testów automatycznych z użyciem C# i Selenium dla kluczowych ścieżek użytkownika, tworząc udokumentowane przypadki testowe wspierające testy regresyjne i zapobiegające problemom z integralnością danych.
          - Wykrywałem i zgłaszałem krytyczne błędy podczas testów manualnych, śledząc wszystkie zgłoszenia w Redmine, aby utrzymać wysoką jakość produktu i rzetelność danych.
          - Współpracowałem z zespołem deweloperskim nad poprawą pokrycia testami i procesów testowych dla platformy analitycznej.
          - "**Technologie:** C#, Selenium, Redmine"

    Języki:
      - label: Polski
        details: ojczysty
      - label: Angielski
        details: zaawansowany
      - label: Niemiecki
