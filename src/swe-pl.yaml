      Wyrażam zgodę na przetwarzanie moich danych osobowych zawartych w niniejszym CV przez potencjalnego pracodawcę
      #linebreak()
      w celu przeprowadzenia rekrutacji, zgodnie z Rozporządzeniem Parlamentu Europejskiego i Rady (UE) 2016/679 (RODO).

